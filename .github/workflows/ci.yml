# SPDX-License-Identifier: AGPL-3.0-only
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}
      - run: cargo fmt --all --check
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: {components: clippy}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
  deny:
    name: cargo-deny (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  codegen-drift:
    name: schema → types drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt}
      - run: python3 tools/gen_types.py && cargo fmt --all && git diff --exit-code
  conformance-sync:
    name: conformance vectors match wutong-protocol@main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with: {repository: project-wutong/wutong-protocol, path: _protocol}
      - run: |
          for d in schemas examples vectors; do diff -r "_protocol/$d" "conformance/$d"; done
          cmp _protocol/schemas/core.schema.json crates/wtp-wire/src/core.schema.json
  ffi-c-smoke:
    name: C ABI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p wutong-ffi --release --locked
      - run: cc -std=c11 -Wall -Werror -Icrates/wutong-ffi/include crates/wutong-ffi/tests/smoke.c target/release/libwutong_ffi.a -lpthread -ldl -lm -o smoke && ./smoke
