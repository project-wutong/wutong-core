[graph]
all-features = true

[licenses]
# AGPL-3.0-only project: permissive and weak/strong copyleft licenses compatible with AGPL.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
         "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "MIT-0", "BSL-1.0",
         "AGPL-3.0-only", "AGPL-3.0-or-later", "LGPL-3.0", "CDLA-Permissive-2.0", "OpenSSL"]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/project-wutong/wutong-core"]
